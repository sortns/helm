{{- if eq (include "pdns-r53-sync.createSecret" .) "true" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pdns-r53-sync.secretName" . }}
  labels:
    {{- include "pdns-r53-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv.values }}
  {{- if ne (toString $value) "" }}
  {{ $name }}: {{ toString $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
