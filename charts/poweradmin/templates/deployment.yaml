apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poweradmin.fullname" . }}
  labels:
    {{- include "poweradmin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "poweradmin.selectorLabels" . | nindent 6 }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "poweradmin.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "poweradmin.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.databaseInit.enabled }}
      initContainers:
        - name: db-init
          image: "{{ .Values.image.repository }}:{{ include "poweradmin.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.databaseInit.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "poweradmin.fullname" . }}
          {{- if or (eq (include "poweradmin.hasSecretEnv" .) "true") .Values.databaseInit.extraEnv }}
          env:
            {{- if eq (include "poweradmin.hasSecretEnv" .) "true" }}
            {{- range $name, $value := .Values.secretEnv.values }}
            {{- if ne (toString $value) "" }}
            - name: {{ printf "%s__FILE" $name }}
              value: "{{ $.Values.secretEnv.mountPath }}/{{ $name }}"
            {{- end }}
            {{- end }}
            {{- range $name, $key := .Values.secretEnv.existingSecretKeys }}
            - name: {{ printf "%s__FILE" $name }}
              value: "{{ $.Values.secretEnv.mountPath }}/{{ $key }}"
            {{- end }}
            {{- end }}
            {{- with .Values.databaseInit.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              process_secret_files() {
                for VAR_NAME in $(env | grep '^[^=]\+__FILE=.\+' | sed -r 's/^([^=]*)__FILE=.*/\1/g'); do
                  VAR_NAME_FILE="${VAR_NAME}__FILE"
                  if [ "${!VAR_NAME}" ]; then
                    echo "ERROR: Both ${VAR_NAME} and ${VAR_NAME_FILE} are set but are exclusive" >&2
                    exit 1
                  fi
                  VAR_FILENAME="${!VAR_NAME_FILE}"
                  if [ ! -r "${VAR_FILENAME}" ]; then
                    echo "ERROR: ${VAR_FILENAME} does not exist or is not readable" >&2
                    exit 1
                  fi
                  export "${VAR_NAME}"="$(<"${VAR_FILENAME}")"
                  unset "${VAR_NAME_FILE}"
                done
              }

              process_secret_files

              case "${DB_TYPE}" in
                sqlite)
                  DB_FILE="${DB_FILE:-/db/pdns.db}"
                  mkdir -p "$(dirname "${DB_FILE}")"
                  if ! sqlite3 "${DB_FILE}" "SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1; then
                    echo "Initializing Poweradmin SQLite schema at ${DB_FILE}"
                    if ! sqlite3 "${DB_FILE}" ".schema users" >/dev/null 2>&1; then
                      sqlite3 "${DB_FILE}" < /app/sql/poweradmin-sqlite-db-structure.sql
                    fi
                    if [ "${PA_INIT_PDNS_SCHEMA:-false}" = "true" ] && ! sqlite3 "${DB_FILE}" ".schema domains" >/dev/null 2>&1; then
                      sqlite3 "${DB_FILE}" < "/app/sql/pdns/${PDNS_VERSION:-49}/schema.sqlite3.sql"
                    fi
                  fi
                  ;;
                mysql)
                  PORT_OPT=""
                  [ -n "${DB_PORT:-}" ] && PORT_OPT="-P${DB_PORT}"
                  SSL_OPTS=""
                  DB_SSL_LC=$(echo "${DB_SSL:-false}" | tr '[:upper:]' '[:lower:]')
                  DB_SSL_VERIFY_LC=$(echo "${DB_SSL_VERIFY:-false}" | tr '[:upper:]' '[:lower:]')
                  if [ "${DB_SSL_LC}" != "true" ]; then
                    SSL_OPTS="--skip-ssl"
                  elif [ "${DB_SSL_VERIFY_LC}" != "true" ]; then
                    SSL_OPTS="--skip-ssl-verify-server-cert"
                  fi
                  USERS_EXISTS=$(mysql ${SSL_OPTS} -h"${DB_HOST}" ${PORT_OPT} -u"${DB_USER}" -p"${DB_PASS}" "${DB_NAME}" -sNe \
                    "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${DB_NAME}' AND table_name='users';")
                  if [ "${USERS_EXISTS}" = "0" ]; then
                    echo "Initializing Poweradmin MySQL schema in ${DB_NAME}"
                    mysql ${SSL_OPTS} -h"${DB_HOST}" ${PORT_OPT} -u"${DB_USER}" -p"${DB_PASS}" "${DB_NAME}" < /app/sql/poweradmin-mysql-db-structure.sql
                  fi
                  if [ "${PA_INIT_PDNS_SCHEMA:-false}" = "true" ] && [ -z "${PA_PDNS_DB_NAME:-}" ]; then
                    DOMAINS_EXISTS=$(mysql ${SSL_OPTS} -h"${DB_HOST}" ${PORT_OPT} -u"${DB_USER}" -p"${DB_PASS}" "${DB_NAME}" -sNe \
                      "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${DB_NAME}' AND table_name='domains';")
                    if [ "${DOMAINS_EXISTS}" = "0" ]; then
                      echo "Initializing PowerDNS MySQL schema in ${DB_NAME}"
                      mysql ${SSL_OPTS} -h"${DB_HOST}" ${PORT_OPT} -u"${DB_USER}" -p"${DB_PASS}" "${DB_NAME}" < "/app/sql/pdns/${PDNS_VERSION:-49}/schema.mysql.sql"
                    fi
                  fi
                  ;;
                pgsql)
                  PORT_OPT=""
                  [ -n "${DB_PORT:-}" ] && PORT_OPT="-p ${DB_PORT}"
                  USERS_EXISTS=$(PGPASSWORD="${DB_PASS}" psql -h "${DB_HOST}" ${PORT_OPT} -U "${DB_USER}" -d "${DB_NAME}" -tAc \
                    "SELECT to_regclass('public.users') IS NOT NULL;")
                  if [ "${USERS_EXISTS}" = "f" ]; then
                    echo "Initializing Poweradmin PostgreSQL schema in ${DB_NAME}"
                    PGPASSWORD="${DB_PASS}" psql -h "${DB_HOST}" ${PORT_OPT} -U "${DB_USER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -q \
                      -f /app/sql/poweradmin-pgsql-db-structure.sql
                  fi
                  if [ "${PA_INIT_PDNS_SCHEMA:-false}" = "true" ] && [ -z "${PA_PDNS_DB_NAME:-}" ]; then
                    DOMAINS_EXISTS=$(PGPASSWORD="${DB_PASS}" psql -h "${DB_HOST}" ${PORT_OPT} -U "${DB_USER}" -d "${DB_NAME}" -tAc \
                      "SELECT to_regclass('public.domains') IS NOT NULL;")
                    if [ "${DOMAINS_EXISTS}" = "f" ]; then
                      echo "Initializing PowerDNS PostgreSQL schema in ${DB_NAME}"
                      PGPASSWORD="${DB_PASS}" psql -h "${DB_HOST}" ${PORT_OPT} -U "${DB_USER}" -d "${DB_NAME}" -v ON_ERROR_STOP=1 -q \
                        -f "/app/sql/pdns/${PDNS_VERSION:-49}/schema.pgsql.sql"
                    fi
                  fi
                  ;;
                *)
                  echo "Unsupported DB_TYPE: ${DB_TYPE}" >&2
                  exit 1
                  ;;
              esac
          volumeMounts:
            - name: db
              mountPath: /db
            {{- if eq (include "poweradmin.hasSecretEnv" .) "true" }}
            - name: secret-env
              mountPath: {{ .Values.secretEnv.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.databaseInit.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- end }}
      containers:
        - name: poweradmin
          image: "{{ .Values.image.repository }}:{{ include "poweradmin.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "poweradmin.fullname" . }}
          {{- if or (eq (include "poweradmin.hasSecretEnv" .) "true") .Values.extraEnv }}
          env:
            {{- if eq (include "poweradmin.hasSecretEnv" .) "true" }}
            {{- range $name, $value := .Values.secretEnv.values }}
            {{- if ne (toString $value) "" }}
            - name: {{ printf "%s__FILE" $name }}
              value: "{{ $.Values.secretEnv.mountPath }}/{{ $name }}"
            {{- end }}
            {{- end }}
            {{- range $name, $key := .Values.secretEnv.existingSecretKeys }}
            - name: {{ printf "%s__FILE" $name }}
              value: "{{ $.Values.secretEnv.mountPath }}/{{ $key }}"
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: tmp
              mountPath: /tmp
            - name: caddy-data
              mountPath: /var/caddy
            - name: db
              mountPath: /db
            {{- if eq (include "poweradmin.hasSecretEnv" .) "true" }}
            - name: secret-env
              mountPath: {{ .Values.secretEnv.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: db
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "poweradmin.fullname" . }}-db
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if eq (include "poweradmin.hasSecretEnv" .) "true" }}
        - name: secret-env
          secret:
            secretName: {{ include "poweradmin.secretName" . }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
