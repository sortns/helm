apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poweradmin.fullname" . }}
  labels:
    {{- include "poweradmin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "poweradmin.selectorLabels" . | nindent 6 }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "poweradmin.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "poweradmin.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: poweradmin
          image: "{{ .Values.image.repository }}:{{ include "poweradmin.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "poweradmin.fullname" . }}
          {{- if or (eq (include "poweradmin.hasSecretEnv" .) "true") .Values.extraEnv }}
          env:
            {{- if eq (include "poweradmin.hasSecretEnv" .) "true" }}
            {{- range $name, $value := .Values.secretEnv.values }}
            {{- if ne (toString $value) "" }}
            - name: {{ printf "%s__FILE" $name }}
              value: "{{ $.Values.secretEnv.mountPath }}/{{ $name }}"
            {{- end }}
            {{- end }}
            {{- range $name, $key := .Values.secretEnv.existingSecretKeys }}
            - name: {{ printf "%s__FILE" $name }}
              value: "{{ $.Values.secretEnv.mountPath }}/{{ $key }}"
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: tmp
              mountPath: /tmp
            - name: caddy-data
              mountPath: /var/caddy
            - name: db
              mountPath: /db
            {{- if eq (include "poweradmin.hasSecretEnv" .) "true" }}
            - name: secret-env
              mountPath: {{ .Values.secretEnv.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: db
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "poweradmin.fullname" . }}-db
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if eq (include "poweradmin.hasSecretEnv" .) "true" }}
        - name: secret-env
          secret:
            secretName: {{ include "poweradmin.secretName" . }}
            defaultMode: 0400
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
