{{- if eq (include "poweradmin.createSecret" .) "true" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poweradmin.secretName" . }}
  labels:
    {{- include "poweradmin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secretEnv.values }}
  {{- if ne (toString $value) "" }}
  {{ $name }}: |-
{{ toString $value | indent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
