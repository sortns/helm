name: pdns-r53-sync

on:
  push:
    branches:
      - master
    paths:
      - apps/pdns-r53-sync/**
      - charts/pdns-r53-sync/**
      - .github/workflows/pdns-r53-sync.yml
  pull_request:
    paths:
      - apps/pdns-r53-sync/**
      - charts/pdns-r53-sync/**
      - .github/workflows/pdns-r53-sync.yml
  workflow_dispatch:

concurrency:
  group: pdns-r53-sync-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  APP_DIR: apps/pdns-r53-sync
  CHART_DIR: charts/pdns-r53-sync
  IMAGE: ghcr.io/${{ github.repository_owner }}/pdns-r53-sync
  KUBECONFORM_VERSION: v0.8.0

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: App and chart versions match
        id: version
        run: |
          APP=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" "$APP_DIR/pa_sync/__init__.py")
          CHART=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' "$CHART_DIR/Chart.yaml")
          if [[ -z "$APP" || "$APP" != "$CHART" ]]; then
            echo "::error::pa_sync.__version__ ($APP) must equal $CHART_DIR appVersion ($CHART)"
            exit 1
          fi
          echo "version=$APP" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r "$APP_DIR/requirements.txt"
          python -m pip check
          python -m pip install --disable-pip-version-check -r "$APP_DIR/requirements-dev.txt"

      - name: Tests (unit, moto e2e, chart rendering)
        working-directory: ${{ env.APP_DIR }}
        run: python -m pytest -q

      - name: Lint chart
        run: |
          helm lint "$CHART_DIR" \
            --set zone=example.com \
            --set poweradmin.url=https://pa.example.net \
            --set route53.hostedZoneId=Z0123456789ABC \
            --set secretEnv.existingSecret=dns-sync

      - name: Validate manifests
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" kubeconform
          helm template dns-sync "$CHART_DIR" --namespace dns \
            --set zone=example.com \
            --set poweradmin.url=https://pa.example.net \
            --set route53.hostedZoneId=Z0123456789ABC \
            --set secretEnv.existingSecret=dns-sync \
            --set serviceAccount.create=true \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set networkPolicy.enabled=true \
            | "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.31.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip versions that are already published
        id: exists
        if: env.PUBLISH == 'true'
        run: |
          # Version tags are immutable: app changes need a version bump (pa_sync.__version__ + appVersion)
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::warning::$IMAGE:$VERSION already exists, not overwriting it. Bump the version to publish app changes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on master)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
