name: Update poweradmin chart version

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest stable 4.2.x tag
        id: upstream
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/poweradmin/poweradmin.git 'v4.2.*' \
            | awk -F/ '{print $3}' \
            | sed 's/\^{}//' \
            | sort -V \
            | tail -n1)

          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read current chart version
        id: current
        run: |
          APP=$(grep '^appVersion:' charts/poweradmin/Chart.yaml \
            | sed 's/appVersion: //; s/"//g; s/ //g')
          CHART=$(grep '^version:' charts/poweradmin/Chart.yaml \
            | sed 's/version: //; s/"//g; s/ //g')
          echo "appVersion=$APP" >> "$GITHUB_OUTPUT"
          echo "chartVersion=$CHART" >> "$GITHUB_OUTPUT"

      - name: Bump chart when upstream is newer
        id: bump
        if: steps.upstream.outputs.version != steps.current.outputs.appVersion
        run: |
          NEW_APP="${{ steps.upstream.outputs.version }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.chartVersion }}"
          NEW_CHART="$MAJOR.$MINOR.$((PATCH + 1))"

          sed -i "s/^appVersion: .*/appVersion: \"$NEW_APP\"/" charts/poweradmin/Chart.yaml
          sed -i "s/^version: .*/version: $NEW_CHART/" charts/poweradmin/Chart.yaml

          awk -v new="$NEW_APP" '
            /repository: poweradmin\/poweradmin/ { found=1 }
            found && /^  tag:/ { sub(/".*"/, "\"" new "\""); found=0 }
            { print }
          ' charts/poweradmin/values.yaml > /tmp/poweradmin-values.yaml && mv /tmp/poweradmin-values.yaml charts/poweradmin/values.yaml

          echo "newAppVersion=$NEW_APP" >> "$GITHUB_OUTPUT"
          echo "newChartVersion=$NEW_CHART" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(poweradmin): update to v${{ steps.bump.outputs.newAppVersion }}"
          branch: "chore/poweradmin-${{ steps.bump.outputs.newAppVersion }}"
          delete-branch: true
          title: "chore(poweradmin): update to v${{ steps.bump.outputs.newAppVersion }}"
          body: |
            Automated version bump for the **poweradmin** Helm chart.

            | | Before | After |
            |---|---|---|
            | appVersion | `${{ steps.current.outputs.appVersion }}` | `${{ steps.bump.outputs.newAppVersion }}` |
            | chart version | `${{ steps.current.outputs.chartVersion }}` | `${{ steps.bump.outputs.newChartVersion }}` |

            Upstream tag: https://github.com/poweradmin/poweradmin/releases/tag/${{ steps.upstream.outputs.tag }}
          labels: |
            automated
            poweradmin
